# Lokalni razvoj: samo baza. Backend i frontend pokreću se izravno (vidi HOW_TO_RUN.md).
# Zadane vrijednosti odgovaraju backend/src/main/resources/application.yml,
# pa radi i bez .env datoteke.
services:
  db:
    image: postgres:17
    container_name: artconnect-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-artconnect}
      POSTGRES_USER: ${DB_USER:-artconnect}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-artconnect}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-artconnect} -d ${DB_NAME:-artconnect}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
